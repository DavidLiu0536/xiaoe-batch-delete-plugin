<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小鹅通考试批量管理工具</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
    }
    
    .header {
      color: white;
      text-align: center;
      margin-bottom: 15px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }
    
    .header p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }
    
    .status {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #333;
    }
    
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      color: white;
      text-align: center;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .btn-primary {
      background: #4CAF50;
    }
    
    .btn-secondary {
      background: #2196F3;
    }
    
    .btn-info {
      background: #ff9800;
    }
    
    .footer {
      margin-top: 15px;
      text-align: center;
      color: white;
      font-size: 11px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 考试批量管理工具</h1>
    <p>小鹅通考试重复副本处理插件</p>
  </div>
  
  <div class="status" id="status">
    请在小鹅通考试管理页面使用此插件
  </div>
  
  <div class="buttons">
    <button class="btn btn-primary" id="openExamPage">打开考试管理页面</button>
    <button class="btn btn-secondary" id="showHelp">使用说明</button>
  </div>
  
  <div class="footer">
    版本 1.0.0 | 自动化重复考试处理
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
